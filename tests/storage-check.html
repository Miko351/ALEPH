<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <title>로컬 저장값 복구 검사</title>
</head>
<body>
  <h1>저장값 복구 검사</h1>
  <p>테스트 전용 로컬 주소에서만 실행하세요. 기존 기록이 있는 주소에서는 검사를 시작하지 않습니다.</p>
  <p>각 검사는 저장값이 없는 새 브라우저 환경에서 별도로 실행하세요.</p>
  <button id="empty-check" type="button">빈 저장값 검사</button>
  <button id="broken-check" type="button">손상된 저장값 검사</button>
  <p id="status" role="status"></p>
  <script>
    (() => {
      const keys = ['greenhouse-scene-test-record-v1', 'greenhouse-play-history-v1'];
      const buttons = {
        empty: document.getElementById('empty-check'),
        broken: document.getElementById('broken-check')
      };
      const status = document.getElementById('status');

      if (!['localhost', '127.0.0.1'].includes(location.hostname)) {
        Object.values(buttons).forEach(button => { button.disabled = true; });
        status.textContent = 'localhost 또는 127.0.0.1에서만 실행할 수 있습니다.';
        return;
      }

      function runCheck(mode) {
        try {
          if (keys.some(key => localStorage.getItem(key) !== null)) {
            status.textContent = '기존 기록이 있습니다. 기록을 지우지 않도록 새 브라우저 환경에서 검사하세요.';
            return;
          }
          if (mode === 'broken') keys.forEach(key => localStorage.setItem(key, '{broken'));
          location.assign(new URL('../dist/game.html', location.href));
        } catch {
          status.textContent = '저장소에 접근할 수 없어 검사를 시작하지 못했습니다.';
        }
      }

      buttons.empty.addEventListener('click', () => runCheck('empty'));
      buttons.broken.addEventListener('click', () => runCheck('broken'));
    })();
  </script>
</body>
</html>
