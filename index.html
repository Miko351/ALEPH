<html lang="ko">
<head>

  <title>온실 봉쇄 · 시작</title>
  <meta name="description" content="탐사원의 길을 선택해 표본을 모으고 괴생물의 추적을 피하는 25초 브라우저 게임, 온실 봉쇄">
  <link rel="stylesheet" href="./styles.css">
</head>
<body class="landing-page">
  <main class="landing-shell">
    <section class="landing-stage" aria-labelledby="landing-title">
      <div class="landing-content">
        <p class="landing-eyebrow">25 SECOND SURVIVAL · BROWSER GAME</p>
        <p class="landing-chapter">탐사 기록 01 / 온실 구역</p>
        <h1 id="landing-title">온실 봉쇄</h1>
        <p class="landing-lead">표본을 모으는 탐사원의 길은 당신이 결정합니다.<br>괴생물은 스스로 순찰하고 추적합니다.</p>

        <div class="landing-rules" aria-label="게임 핵심 규칙">
          <p><strong>목표</strong><span>25초가 끝날 때 표본 3개 이상, 경보 4 이하</span></p>
          <p><strong>조작</strong><span><kbd>↑</kbd> 위쪽 길 · <kbd>↓</kbd> 아래쪽 길 선택</span></p>
          <p><strong>실패</strong><span>경보 5에 도달하거나 표본이 부족할 때</span></p>
        </div>

        <a class="landing-start" href="./game.html">작전 시작 <span aria-hidden="true">➜</span></a>
        <p class="landing-footnote">게임 중 <kbd>P</kbd> 일시정지 · <kbd>R</kbd> 새 판 · 화면 버튼으로도 조작 가능</p>
      </div>
      <div class="landing-specimen" aria-hidden="true"><img src="./assets/specimen.png" alt=""></div>
      <div class="landing-tech" aria-hidden="true"><img src="./assets/technician.png" alt=""></div>
      <span class="landing-stamp" aria-hidden="true">CONTAINMENT<br>BREACH</span>
